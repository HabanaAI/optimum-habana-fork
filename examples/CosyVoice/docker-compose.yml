version: '3.8'

services:
  cosyvoice-server:
    image: cosyvoice:latest
    container_name: cosyvoice-server
    runtime: habana
    command: /bin/bash /CosyVoice/start.sh
    
    # 环境变量配置
    environment:
      # Habana 设备配置
      - HABANA_VISIBLE_DEVICES=${HABANA_VISIBLE_DEVICES:-0}
      - OMPI_MCA_btl_vader_single_copy_mechanism=none
      
      # 路径环境变量（从 .env 文件读取或使用默认值）
      - MODELS_HOST_PATH=${MODELS_HOST_PATH:-/mnt/disk4/hf_models}
      - DATA_HOST_PATH=${DATA_HOST_PATH:-/mnt/disk8}
      - CONTAINER_PORT=9370
      - HOST_PORT=${HOST_PORT:-9370}
      
      # 其他可能需要的环境变量
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # 端口映射（使用环境变量）
    ports:
      - "${HOST_PORT}:9370"
    
    # 卷映射（使用环境变量）
    volumes:
      - "${MODELS_HOST_PATH}:/models"
      - "${DATA_HOST_PATH}:/data"
      - /dev:/dev
    
    # 健康检查（3分钟后开始检测）
    healthcheck:
      test: ["CMD", "pgrep", "api_server.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # 3分钟后开始健康检查
      start_interval: 10s
    
    # 权限配置
    cap_add:
      - SYS_NICE 
      - IPC_LOCK
    devices:
      - /dev:/dev

