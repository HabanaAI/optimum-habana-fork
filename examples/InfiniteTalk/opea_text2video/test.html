<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频生成工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #5e72e4 0%, #825ee4 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #32325d;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            display: none;
        }

        .file-input-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #718096;
            font-size: 14px;
        }

        .file-input-button:hover {
            background: #edf2f7;
            border-color: #a0aec0;
        }

        .file-input-button.has-file {
            background: #e6fffa;
            border-color: #38b2ac;
            color: #234e52;
        }

        .file-name {
            margin-left: 8px;
            font-weight: 500;
        }

        textarea,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        textarea:focus,
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #5e72e4;
            box-shadow: 0 0 0 3px rgba(94, 114, 228, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-wrapper:hover {
            background: #edf2f7;
            border-color: #a0aec0;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #5e72e4;
            cursor: pointer;
        }

        .checkbox-wrapper .checkbox-label {
            font-size: 14px;
            color: #32325d;
            cursor: pointer;
        }

        .hint {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
        }

        .submit-button {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .submit-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-section {
            display: none;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
        }

        .progress-section.active {
            display: block;
        }

        .progress-title {
            font-weight: 600;
            color: #32325d;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 14px;
            color: #718096;
            text-align: center;
        }

        .video-section {
            display: none;
            margin-top: 30px;
            text-align: center;
        }

        .video-section.active {
            display: block;
        }

        .video-title {
            font-weight: 600;
            color: #32325d;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .error-message {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #e53e3e;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5e72e4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status-indicator.queued {
            background: #fef5e7;
            color: #d68910;
        }

        .status-indicator.processing {
            background: #e6f3ff;
            color: #0066cc;
        }

        .status-indicator.completed {
            background: #e6fffa;
            color: #00a896;
        }

        .status-indicator.error {
            background: #fed7d7;
            color: #e53e3e;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>视频生成工具</h1>
            <p>使用AI技术根据图片和文本提示生成视频</p>
        </div>

        <div class="content">
            <form id="videoForm">
                <div class="form-section">
                    <div class="form-group">
                        <label for="inputReference">源参考图像（可选）</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="inputReference" class="file-input" accept="image/*">
                            <div class="file-input-button" id="inputReferenceButton">
                                <span>🖼️ 选择源参考图像</span>
                            </div>
                        </div>
                        <div class="hint">用于指导视频生成的源参考图像文件</div>
                    </div>

                    <div class="form-group">
                        <label for="prompt">文本提示（可选）</label>
                        <textarea id="prompt" placeholder="请输入描述您想要生成的视频内容的文本提示..."></textarea>
                        <div class="hint">用于指导视频生成的描述性文本提示</div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="steps">推理步数</label>
                            <input type="number" id="steps" value="50" min="1" max="100">
                            <div class="hint">默认值: 50</div>
                        </div>

                        <div class="form-group">
                            <label for="seed">随机种子</label>
                            <input type="number" id="seed" value="42" min="0">
                            <div class="hint">用于可复现结果的随机种子</div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="guideScale">引导程度</label>
                            <input type="number" id="guideScale" value="5.0" min="0" max="20" step="0.1">
                            <div class="hint">控制生成视频与提示的贴合程度</div>
                        </div>

                        <div class="form-group">
                            <label for="seconds">视频长度（秒）</label>
                            <input type="number" id="seconds" value="5" min="1" max="60">
                            <div class="hint">期望的视频长度</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>视频方向</label>
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="portrait">
                            <span class="checkbox-label">竖屏模式（默认为横屏 1280×704）</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-button" id="submitButton">
                    开始生成视频
                </button>
            </form>

            <div class="error-message" id="errorMessage"></div>

            <div class="progress-section" id="progressSection">
                <div class="progress-title">视频生成中...</div>
                <div class="status-indicator" id="statusIndicator">排队中</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <div class="video-section" id="videoSection">
                <div class="video-title">生成的视频</div>
                <video controls id="resultVideo"></video>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://10.239.15.47:9396';

        let currentVideoId = null;
        let progressInterval = null;

        // DOM元素
        const form = document.getElementById('videoForm');
        const inputReferenceInput = document.getElementById('inputReference');
        const promptTextarea = document.getElementById('prompt');
        const stepsInput = document.getElementById('steps');
        const seedInput = document.getElementById('seed');
        const portraitCheckbox = document.getElementById('portrait');
        const guideScaleInput = document.getElementById('guideScale');
        const secondsInput = document.getElementById('seconds');
        const submitButton = document.getElementById('submitButton');
        const inputReferenceButton = document.getElementById('inputReferenceButton');
        const progressSection = document.getElementById('progressSection');
        const videoSection = document.getElementById('videoSection');
        const errorMessage = document.getElementById('errorMessage');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const statusIndicator = document.getElementById('statusIndicator');
        const resultVideo = document.getElementById('resultVideo');

        // 文件选择处理
        inputReferenceInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                inputReferenceButton.classList.add('has-file');
                inputReferenceButton.innerHTML = `<span>🖼️</span><span class="file-name">${file.name}</span>`;
                console.log('选择的源参考图像:', file.name, file.size, file.type);
            }
        });

        // 点击按钮触发文件选择
        inputReferenceButton.addEventListener('click', () => {
            inputReferenceInput.click();
        });

        // 表单提交处理
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const inputReferenceFile = inputReferenceInput.files[0];
            const prompt = promptTextarea.value.trim();
            const steps = parseInt(stepsInput.value) || 50;
            const seed = parseInt(seedInput.value) || 42;
            const portrait = portraitCheckbox.checked;
            const guideScale = parseFloat(guideScaleInput.value) || 5.0;
            const seconds = parseInt(secondsInput.value) || 5;

            console.log('开始提交视频生成请求...');
            console.log('参数:', {
                inputReference: inputReferenceFile ? inputReferenceFile.name : '(无)',
                prompt: prompt || '(空)',
                steps: steps,
                seed: seed,
                portrait: portrait,
                guideScale: guideScale,
                seconds: seconds
            });

            // 创建FormData
            const formData = new FormData();
            if (inputReferenceFile) {
                formData.append('input_reference', inputReferenceFile);
            }
            if (prompt) {
                formData.append('prompt', prompt);
            }
            formData.append('steps', steps);
            formData.append('seed', seed);
            formData.append('portrait', portrait);
            formData.append('guide_scale', guideScale);
            formData.append('seconds', seconds);

            try {
                // 禁用提交按钮
                submitButton.disabled = true;
                submitButton.innerHTML = '<span class="loading-spinner"></span>提交中...';

                // 隐藏错误信息和之前的视频
                hideError();
                hideVideo();
                showProgress();

                // 发送请求
                const response = await fetch(`${API_BASE_URL}/v1/videos`, {
                    method: 'POST',
                    body: formData
                });

                console.log('API响应状态:', response.status, response.statusText);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                console.log('API响应内容:', result);

                if (result.error) {
                    throw new Error(result.error);
                }

                currentVideoId = result.id;
                console.log('视频生成任务已提交，ID:', currentVideoId);

                // 开始轮询进度
                startProgressPolling();

            } catch (error) {
                console.error('提交请求失败:', error);
                showError('提交请求失败: ' + error.message);
                resetForm();
            }
        });

        // 轮询进度
        function startProgressPolling() {
            if (!currentVideoId) return;

            console.log('开始轮询视频生成进度...');

            progressInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/v1/videos/${currentVideoId}`);

                    console.log('进度查询响应状态:', response.status);

                    if (!response.ok) {
                        throw new Error(`查询进度失败: ${response.status}`);
                    }

                    const status = await response.json();
                    console.log('进度查询结果:', status);

                    updateProgress(status);

                    if (status.status === 'completed') {
                        clearInterval(progressInterval);
                        console.log('视频生成完成');
                        await downloadVideo();
                    } else if (status.status === 'error') {
                        clearInterval(progressInterval);
                        console.error('视频生成失败:', status.error);
                        showError('视频生成失败: ' + status.error);
                        resetForm();
                    }

                } catch (error) {
                    console.error('查询进度失败:', error);
                    clearInterval(progressInterval);
                    showError('查询进度失败: ' + error.message);
                    resetForm();
                }
            }, 2000); // 每2秒查询一次
        }

        // 更新进度显示
        function updateProgress(status) {
            const progress = status.progress || 0;

            progressFill.style.width = `${progress}%`;
            progressText.textContent = `${progress}%`;

            // 更新状态指示器
            statusIndicator.className = 'status-indicator';

            switch (status.status) {
                case 'queued':
                    statusIndicator.classList.add('queued');
                    statusIndicator.textContent = '排队中';
                    break;
                case 'processing':
                case 'in_progress':
                    statusIndicator.classList.add('processing');
                    statusIndicator.textContent = '处理中';
                    break;
                case 'completed':
                    statusIndicator.classList.add('completed');
                    statusIndicator.textContent = '已完成';
                    break;
                case 'error':
                    statusIndicator.classList.add('error');
                    statusIndicator.textContent = '错误';
                    break;
                default:
                    statusIndicator.textContent = status.status;
            }
        }

        // 下载视频
        async function downloadVideo() {
            if (!currentVideoId) return;

            try {
                console.log('开始下载生成的视频...');

                const response = await fetch(`${API_BASE_URL}/v1/videos/${currentVideoId}/content`);

                console.log('视频下载响应状态:', response.status);

                if (!response.ok) {
                    throw new Error(`下载视频失败: ${response.status}`);
                }

                const blob = await response.blob();
                const videoUrl = URL.createObjectURL(blob);

                console.log('视频下载完成，大小:', blob.size, 'bytes');

                // 显示视频
                resultVideo.src = videoUrl;
                showVideo();

                resetForm();

            } catch (error) {
                console.error('下载视频失败:', error);
                showError('下载视频失败: ' + error.message);
                resetForm();
            }
        }

        // UI辅助函数
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        function hideError() {
            errorMessage.classList.remove('active');
        }

        function showProgress() {
            progressSection.classList.add('active');
        }

        function hideProgress() {
            progressSection.classList.remove('active');
        }

        function showVideo() {
            videoSection.classList.add('active');
        }

        function hideVideo() {
            videoSection.classList.remove('active');
            resultVideo.src = '';
        }

        function resetForm() {
            submitButton.disabled = false;
            submitButton.textContent = '开始生成视频';
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        // 页面加载时的设置
        document.addEventListener('DOMContentLoaded', () => {
            console.log('视频生成工具页面已加载');
            console.log('API基础地址:', API_BASE_URL);
        });
    </script>
</body>

</html>
